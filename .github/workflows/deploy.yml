# Publishes the site to Cloudflare Pages on every push to main that touches the app,
# with the same version tags as scripts/deploy.sh. Can also be started by hand
# (Actions tab, "Publish", Run workflow).
name: Publish
on:
  push:
    branches: [main]
    paths: ['public/**', 'functions/**', 'scripts/deploy.sh', 'wrangler.toml']
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TZ: Europe/Zurich
      npm_config_yes: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/deploy.sh
